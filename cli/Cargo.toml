[package]
name = "markmax-sync"
version = "0.1.0"
edition = "2024"
description = "markmax bookmark local sync daemon（与 Chrome 插件共享缓存目录）"

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
reqwest = { version = "0.13.4", features = ["json"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
uuid = { version = "1.25.0", features = ["v4"] }
