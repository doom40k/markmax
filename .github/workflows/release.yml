# tag 推送时构建 CLI 二进制并附到 GitHub Release，供 Homebrew formula 直接下载
# 产物命名：markmax-sync-<tag>-<target>.tar.gz（内含单个 markmax-sync 可执行文件）
#
# 双架构均在 Apple Silicon runner 上构建：aarch64 原生编译，
# x86_64 交叉编译（macOS 工具链原生支持，避免依赖已停供的 Intel runner）
#
# 同时构建服务端多架构镜像（linux/amd64 + linux/arm64）并推送到 Docker Hub：doom40k/markmax-server
# 需要在仓库 Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
# 两个平台分别在原生 runner 上构建（arm64 用 GitHub 公开仓库免费的 ubuntu-24.04-arm），
# 避免 QEMU 模拟编译慢；随后由 docker-merge job 合成多架构 manifest
#
# 另将 Chrome 插件打成 zip 附到 Release（extension job）：
# 产物命名 markmax-extension-<版本>.zip，解压后即「加载已解压的扩展程序」可用的目录；
# 插件无构建步骤（纯静态文件），打包时仅同步 manifest 版本号到 release tag
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  IMAGE: doom40k/markmax-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: cli
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME}"
          mkdir -p pkg
          cp "cli/target/${TARGET}/release/markmax-sync" "pkg/markmax-sync"
          # x86_64 产物在 Apple Silicon 上无法本机验证，至少确认架构正确
          file "pkg/markmax-sync"
          tar -czf "markmax-sync-${VER}-${TARGET}.tar.gz" -C pkg markmax-sync
          shasum -a 256 "markmax-sync-${VER}-${TARGET}.tar.gz" > "markmax-sync-${VER}-${TARGET}.tar.gz.sha256"
          cat "markmax-sync-${VER}-${TARGET}.tar.gz.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            markmax-sync-*-${{ env.TARGET }}.tar.gz
            markmax-sync-*-${{ env.TARGET }}.tar.gz.sha256

  # Chrome 插件打包：无构建步骤，同步版本号到 tag 后打 zip。
  # 目录显式列出（manifest/icons/lib/options/popup/shared.css），
  # 新增顶层文件时需同步这里，避免开发工具（tools/）等无关内容混入分发包。
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p stage/markmax-extension
          # 插件版本跟随仓库 release tag，避免与发布版本漂移
          jq --arg v "$VER" '.version = $v' extension/manifest.json > stage/markmax-extension/manifest.json
          cp -r extension/icons extension/lib extension/options extension/popup extension/shared.css stage/markmax-extension/
          (cd stage && zip -qr "../markmax-extension-${VER}.zip" markmax-extension)
          unzip -l "markmax-extension-${VER}.zip"
          shasum -a 256 "markmax-extension-${VER}.zip" > "markmax-extension-${VER}.zip.sha256"
          cat "markmax-extension-${VER}.zip.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            markmax-extension-*.zip
            markmax-extension-*.zip.sha256

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 先推到带平台后缀的临时 tag（如 0.1.3-linux-arm64），再由 docker-merge 合成多架构 manifest
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-merge:
    needs: docker
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          VER="${VERSION#v}"
          for tag in "$VER" "latest"; do
            docker manifest create "$IMAGE:$tag" \
              --amend "$IMAGE:$VER-linux-amd64" \
              --amend "$IMAGE:$VER-linux-arm64"
            docker manifest push "$IMAGE:$tag"
          done
        # 注：不删除 $VER-linux-amd64 / $VER-linux-arm64 临时 tag（Docker Hub token
        # 未授予 delete 权限会 403）；如需清理，给 token 加 delete 权限后再加清理步骤
